/*
===========================================================
  CONTROLE DE CONFIGURAÇÕES USADAS
===========================================================

Aqui está a principal mudança.

Cada aparelho possui uma lista própria de configurações
já utilizadas.

Assim:

1ª geração = perfil diferente
2ª geração = outro perfil
3ª geração = outro perfil

Não repete até usar todos.
*/


const usadas = {};


/*
Cria a lista de controle para cada aparelho.
*/

Object.keys(aparelhos).forEach(function(chave) {
    usadas[chave] = [];
});


/*
===========================================================
  EMBARALHAMENTO
===========================================================
*/

function embaralhar(lista) {

    const copia = [...lista];

    for (let i = copia.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copia[i], copia[j]] =
        [copia[j], copia[i]];
    }

    return copia;
}


/*
===========================================================
  ESCOLHER CONFIGURAÇÃO SEM REPETIR
===========================================================
*/

function escolherPerfil(chave) {

    const aparelho = aparelhos[chave];

    /*
    Se todos os perfis já foram usados,
    começa um novo ciclo.
    */

    if (usadas[chave].length >= aparelho.perfis.length) {

        usadas[chave] = [];

    }


    let disponiveis = [];

    for (
        let i = 0;
        i < aparelho.perfis.length;
        i++
    ) {

        if (!usadas[chave].includes(i)) {

            disponiveis.push(i);

        }

    }


    /*
    Escolhe aleatoriamente SOMENTE entre
    os perfis que ainda não foram usados.
    */

    const indiceAleatorio =
        disponiveis[
            Math.floor(
                Math.random() * disponiveis.length
            )
        ];


    usadas[chave].push(indiceAleatorio);


    return aparelho.perfis[indiceAleatorio];
}


/*
===========================================================
  AJUSTE DE MIRA
===========================================================

O perfil base continua sendo controlado.

A mira apenas ajusta levemente a configuração.
*/


function ajustarMira(config, tipo) {

    let ajuste = 0;

    if (tipo === "capa") {
        ajuste = 2;
    }

    if (tipo === "precisao") {
        ajuste = -2;
    }

    if (tipo === "red_dot") {
        ajuste = 1;
    }

    if (tipo === "geral") {
        ajuste = 0;
    }


    return {

        geral: limitar(config[0] + ajuste),

        red: limitar(config[1] + ajuste),

        x2: limitar(config[2] + ajuste),

        x4: limitar(config[3]),

        awm: limitar(config[4]),

        olho: limitar(config[5])

    };
}


/*
===========================================================
  LIMITADOR
===========================================================
*/

function limitar(numero) {

    if (numero < 0) {
        return 0;
    }

    if (numero > 200) {
        return 200;
    }

    return numero;
}


/*
===========================================================
  DPI
===========================================================
*/

function gerarDpi(min, max) {

    if (min === 0 && max === 0) {
        return 0;
    }

    /*
    A DPI também usa valores em passos de 10,
    evitando números quebrados ou estranhos.
    */

    const quantidade =
        Math.floor((max - min) / 10);

    const passo =
        Math.floor(Math.random() * (quantidade + 1));

    return min + (passo * 10);
}


/*
===========================================================
  GERAÇÃO PRINCIPAL
===========================================================
*/

function gerarSensi() {

    const celularSelecionado =
        document.getElementById("celular").value;

    const tipoMira =
        document.getElementById("mira").value;

    const modoDpi =
        document.getElementById("modoDpi").value;


    const aparelho =
        aparelhos[celularSelecionado];


    /*
    Pega um perfil que ainda não foi usado.
    */

    const perfil =
        escolherPerfil(celularSelecionado);


    /*
    Ajusta de acordo com o tipo de mira.
    */

    const config =
        ajustarMira(perfil, tipoMira);


    /*
    APARELHO
    */

    document.getElementById("nomeAparelho").textContent =
        aparelho.nome;


    /*
    DESCRIÇÃO
    */

    let textoMira = "";

    if (tipoMira === "capa") {
        textoMira = "Puxada de capa";
    }

    if (tipoMira === "precisao") {
        textoMira = "Capa + precisão";
    }

    if (tipoMira === "red_dot") {
        textoMira = "Red Dot";
    }

    if (tipoMira === "geral") {
        textoMira = "Configuração geral";
    }


    document.getElementById("descricao").textContent =
        textoMira +
        " • Perfil específico para " +
        aparelho.nome;


    /*
    SENSIBILIDADES
    */

    document.getElementById("geral").textContent =
        config.geral;

    document.getElementById("redDot").textContent =
        config.red;

    document.getElementById("mira2x").textContent =
        config.x2;

    document.getElementById("mira4x").textContent =
        config.x4;

    document.getElementById("awm").textContent =
        config.awm;

    document.getElementById("olhadinha").textContent =
        config.olho;


    /*
    DPI
    */

    const boxDpi =
        document.getElementById("boxDpi");


    if (
        modoDpi === "com" &&
        aparelho.dpi[1] > 0
    ) {

        const dpiGerada =
            gerarDpi(
                aparelho.dpi[0],
                aparelho.dpi[1]
            );


        document.getElementById("dpi").textContent =
            dpiGerada;


        boxDpi.style.display =
            "block";

    } else {

        boxDpi.style.display =
            "none";

    }


    /*
    NÚMERO DA GERAÇÃO
    */

    const numeroGeracao =
        Math.floor(Math.random() * 9999) + 1;


    document.getElementById("geracao").textContent =
        "Configuração #" +
        numeroGeracao +
        " • Perfil diferente do anterior";


    /*
    MOSTRA RESULTADO
    */

    document.getElementById("resultado").style.display =
        "block";


    /*
    ROLA ATÉ O RESULTADO
    */

    document.getElementById("resultado").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


/*

document.getElementById("modoDpi").addEventListener(
