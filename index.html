<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Sensi FF</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #090909, #151515);
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
    padding: 22px 16px 40px;
}

.header {
    text-align: center;
    margin-bottom: 24px;
}

.logo {
    font-size: 30px;
    font-weight: 900;
    color: #ff2b2b;
    text-transform: uppercase;
}

.subtitle {
    color: #aaa;
    font-size: 14px;
    margin-top: 7px;
}

.card {
    background: #1b1b1b;
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 15px;
}

label {
    display: block;
    color: #ddd;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 8px;
}

select {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #333;
    background: #101010;
    color: white;
    font-size: 15px;
    outline: none;
    margin-bottom: 16px;
}

button {
    width: 100%;
    border: 0;
    border-radius: 13px;
    padding: 16px;
    background: #ff2b2b;
    color: white;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
}

button:active {
    transform: scale(.98);
}

.resultado {
    display: none;
}

.aparelho {
    text-align: center;
    color: #ff4444;
    font-size: 20px;
    font-weight: 900;
    margin-bottom: 5px;
}

.info {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 18px;
}

.sensi {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.item {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 13px;
    text-align: center;
}

.item span {
    display: block;
    color: #999;
    font-size: 12px;
    margin-bottom: 5px;
}

.item strong {
    color: white;
    font-size: 22px;
}

.dpi {
    margin-top: 12px;
    background: #101010;
    border: 1px solid #292929;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.dpi span {
    display: block;
    color: #999;
    font-size: 12px;
}

.dpi strong {
    color: #ff4444;
    font-size: 25px;
}

.geracao {
    text-align: center;
    color: #777;
    font-size: 12px;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">Gerador de Sensi FF</div>
        <div class="subtitle">
            Sensibilidades focadas em puxada de capa
        </div>
    </div>

    <div class="card">

        <label>📱 Marca e modelo</label>

        <select id="celular">
            <option value="realme_note70">Realme Note 70</option>
            <option value="realme_c75">Realme C75</option>
            <option value="realme_c71">Realme C71</option>
            <option value="realme_c61">Realme C61</option>
            <option value="samsung_a15">Samsung Galaxy A15</option>
            <option value="samsung_a16">Samsung Galaxy A16</option>
            <option value="samsung_a25">Samsung Galaxy A25</option>
            <option value="samsung_a35">Samsung Galaxy A35</option>
            <option value="xiaomi_redmi13c">Redmi 13C</option>
            <option value="xiaomi_note13">Redmi Note 13</option>
            <option value="motorola_g54">Moto G54</option>
            <option value="motorola_g84">Moto G84</option>
            <option value="iphone11">iPhone 11</option>
            <option value="iphone12">iPhone 12</option>
            <option value="iphone13">iPhone 13</option>
        </select>

        <label>🎯 Tipo de mira</label>

        <select id="mira">
            <option value="capa">Puxada de capa</option>
            <option value="precisao">Capa + precisão</option>
            <option value="red_dot">Red Dot</option>
            <option value="geral">Geral</option>
        </select>

        <label>📲 DPI</label>

        <select id="modoDpi">
            <option value="sem">Sem DPI</option>
            <option value="com">Com DPI</option>
        </select>

        <button onclick="gerarSensi()">
            🔥 GERAR MINHA SENSI
        </button>

    </div>

    <div class="card resultado" id="resultado">

        <div class="aparelho" id="nomeAparelho"></div>

        <div class="info" id="descricao"></div>

        <div class="sensi">

            <div class="item">
                <span>Geral</span>
                <strong id="geral"></strong>
            </div>

            <div class="item">
                <span>Ponto Vermelho</span>
                <strong id="redDot"></strong>
            </div>

            <div class="item">
                <span>Mira 2x</span>
                <strong id="mira2x"></strong>
            </div>

            <div class="item">
                <span>Mira 4x</span>
                <strong id="mira4x"></strong>
            </div>

            <div class="item">
                <span>AWM</span>
                <strong id="awm"></strong>
            </div>

            <div class="item">
                <span>Olhadinha</span>
                <strong id="olhadinha"></strong>
            </div>

        </div>

        <div class="dpi" id="boxDpi">
            <span>DPI recomendada</span>
            <strong id="dpi"></strong>
        </div>

        <div class="geracao" id="geracao"></div>

    </div>

</div>

<script>

/*

*/

    },

    },

    samsung_a16: {
        nome: "Samsung Galaxy A16",
        geral: [181, 196],
        red: [175, 191],
        x2: [165, 183],
        x4: [153, 173],
        awm: [103, 130],
        olho: [143, 163],
        dpi: [420, 540]
    },

    samsung_a25: {
        nome: "Samsung Galaxy A25",
        geral: [178, 193],
        red: [172, 189],
        x2: [162, 181],
        x4: [150, 171],
        awm: [100, 127],
        olho: [140, 160],
        dpi: [420, 560]
    },

    samsung_a35: {
        nome: "Samsung Galaxy A35",
        geral: [176, 192],
        red: [170, 188],
        x2: [160, 180],
        x4: [148, 169],
        awm: [98, 125],
        olho: [138, 158],
        dpi: [420, 560]
    },

    xiaomi_redmi13c: {
        nome: "Redmi 13C",
        geral: [183, 198],

        x4: [154, 175],

    },

    xiaomi_note13: {

    },

    iphone12: {

        dpi: [0, 0]

/* Sorteia um número inteiro dentro da faixa */

function numero(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}


/*
    Cria uma configuração.
    O tipo de mira muda levemente as faixas.
*/

function gerarConfiguracao(perfil, tipo) {

    let fator = 0;

    if (tipo === "capa") {
        fator = 2;
    }

    if (tipo === "precisao") {
        fator = -2;
    }

    if (tipo === "red_dot") {
        fator = 1;
    }

    if (tipo === "geral") {
        fator = 0;
    }

    return {

        geral: numero(
            perfil.geral[0] + fator,
            perfil.geral[1] + fator
        ),

        red: numero(
            perfil.red[0] + fator,
            perfil.red[1] + fator
        ),

        x2: numero(
            perfil.x2[0] + fator,
            perfil.x2[1] + fator
        ),

        x4: numero(
            perfil.x4[0] + fator,
            perfil.x4[1] + fator
        ),

        awm: numero(
            perfil.awm[0],
            perfil.awm[1]
        ),

        olho: numero(
            perfil.olho[0],
            perfil.olho[1]
        )
    };
}


/*
    GERAÇÃO PRINCIPAL
*/

function gerarSensi() {

    const celularSelecionado =
        document.getElementById("celular").value;

    const tipoMira =
        document.getElementById("mira").value;

    const modoDpi =
        document.getElementById("modoDpi").value;

    const perfil =
        aparelhos[celularSelecionado];

    const config =
        gerarConfiguracao(perfil, tipoMira);


    /*
        Mostra o aparelho
    */

    document.getElementById("nomeAparelho").textContent =
        perfil.nome;


    /*
        Mostra descrição
    */

    document.getElementById("descricao").textContent =
        "Configuração focada em puxada de capa — Free Fire OB55";


    /*
        Mostra sensibilidades
    */

    document.getElementById("geral").textContent =
        config.geral;

    document.getElementById("redDot").textContent =
        config.red;

    document.getElementById("mira2x").textContent =
        config.x2;

    document.getElementById("mira4x").textContent =
        config.x4;

    document.getElementById("awm").textContent =
        config.awm;

    document.getElementById("olhadinha").textContent =
        config.olho;


    /*
        DPI

        Se escolher SEM DPI:
        não mostra DPI.

        Se escolher COM DPI:
        gera uma DPI junto.
    */

    const boxDpi =
        document.getElementById("boxDpi");

    if (
        modoDpi === "com" &&
        perfil.dpi[1] > 0
    ) {

        const dpiGerada =
            numero(
                perfil.dpi[0],
                perfil.dpi[1]
            );

        document.getElementById("dpi").textContent =
            dpiGerada;

        boxDpi.style.display = "block";

    } else {

        boxDpi.style.display = "none";

    }


    /*
        Número da geração
    */

    const numeroGeracao =
        Math.floor(Math.random() * 9999) + 1;

    document.getElementById("geracao").textContent =
        "Configuração #" + numeroGeracao +
        " • Gere novamente para criar outra combinação";


    /*
        Mostra resultado
    */

    document.getElementById("resultado").style.display =
        "block";


    /*
        Rola suavemente até o resultado
    */

    document.getElementById("resultado").scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}


/*
    Deixa o resultado escondido quando
    o usuário muda algumas opções.
*/

document.getElementById("modoDpi").addEventListener(
    "change",
    function() {

        if (this.value === "sem") {
            document.getElementById("boxDpi").style.display =
                "none";
        }

    }
);

</script>

</body>
  </html>
