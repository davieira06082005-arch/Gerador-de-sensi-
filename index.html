<script>

/* ==============================
   MOSTRAR / ESCONDER DPI
============================== */

const semDpi = document.getElementById("semDpi");
const comDpi = document.getElementById("comDpi");
const dpiBox = document.getElementById("dpiBox");

semDpi.addEventListener("change", function () {
  dpiBox.classList.remove("active");
});

comDpi.addEventListener("change", function () {
  dpiBox.classList.add("active");
});


/* ==============================
   LIMITAR VALORES
============================== */

function limitar(valor, minimo = 0, maximo = 200) {
  return Math.max(
    minimo,
    Math.min(maximo, Math.round(valor))
  );
}


/* ==============================
   VARIAÇÃO PELO CELULAR
============================== */

function calcularVariacaoCelular(nome) {

  let total = 0;

  for (let i = 0; i < nome.length; i++) {
    total += nome.charCodeAt(i) * (i + 1);
  }

  return (total % 15) - 7;
}


/* ==============================
   GERADOR DE SENSI
============================== */

function gerarSensi() {

  const celular =
    document.getElementById("celular").value.trim();

  const estilo =
    document.getElementById("estilo").value;

  const mira =
    document.getElementById("mira").value;

  const modoDpi =
    document.querySelector(
      'input[name="dpiModo"]:checked'
    ).value;

  const dpiInput =
    document.getElementById("dpi");

  const dpiWarning =
    document.getElementById("dpiWarning");

  /* Verifica celular */

  if (celular === "") {

    alert("Digite o nome do seu celular.");

    document.getElementById("celular").focus();

    return;
  }


  /* ==============================
     VALOR BASE
  ============================== */

  let geral = 190;
  let redDot = 185;
  let mira2x = 175;
  let mira4x = 165;
  let awm = 120;
  let olhadinha = 180;


  /* ==============================
     AJUSTE PELO ESTILO
  ============================== */

  if (estilo === "rush") {

    geral += 6;
    redDot += 7;
    mira2x += 5;
    mira4x += 3;
    awm += 2;
    olhadinha += 6;

  }

  else if (estilo === "equilibrado") {

    geral += 2;
    redDot += 2;
    mira2x += 1;
    mira4x += 1;
    awm += 1;
    olhadinha += 2;

  }

  else if (estilo === "precisao") {

    geral -= 3;
    redDot -= 2;
    mira2x -= 2;
    mira4x += 1;
    awm += 4;
    olhadinha -= 2;

  }

  else if (estilo === "longa") {

    geral -= 7;
    redDot -= 5;
    mira2x -= 4;
    mira4x -= 2;
    awm += 7;
    olhadinha -= 5;

  }


  /* ==============================
     AJUSTE PELO TIPO DE MIRA
  ============================== */

  if (mira === "capa") {

    geral += 5;
    redDot += 6;
    mira2x += 4;
    olhadinha += 4;

  }

  else if (mira === "rapida") {

    geral += 7;
    redDot += 5;
    mira2x += 4;
    mira4x += 2;
    olhadinha += 6;

  }

  else if (mira === "equilibrada") {

    geral += 2;
    redDot += 2;
    mira2x += 2;

  }

  else if (mira === "precisa") {

    geral -= 3;
    redDot -= 2;
    mira2x -= 2;
    mira4x -= 1;
    awm += 3;

  }

  else if (mira === "longa") {

    geral -= 6;
    redDot -= 4;
    mira2x -= 3;
    mira4x -= 2;
    awm += 6;
    olhadinha -= 4;

  }


  /* ==============================
     AJUSTE PELO CELULAR
  ============================== */

  const variacao =
    calcularVariacaoCelular(celular);

  geral += variacao;
  redDot += variacao;
  mira2x += variacao;
  mira4x += variacao;
  awm += Math.round(variacao / 2);
  olhadinha += variacao;


  /* ==============================
     AJUSTE PELO DPI
  ============================== */

  if (modoDpi === "com") {

    const dpi = Number(dpiInput.value);

    if (
      !dpi ||
      dpi < 200 ||
      dpi > 1200
    ) {

      dpiWarning.style.display = "block";

      dpiInput.focus();

      return;

    }

    dpiWarning.style.display = "none";


    /*
      DPI 600 é considerado o ponto central.
      DPI maior = sensibilidade um pouco menor.
      DPI menor = sensibilidade um pouco maior.
    */

    const ajusteDpi =
      Math.round((600 - dpi) / 100);

    geral += ajusteDpi;
    redDot += ajusteDpi;
    mira2x += ajusteDpi;
    mira4x += ajusteDpi;
    awm += Math.round(ajusteDpi / 2);
    olhadinha += ajusteDpi;

  }


  /* ==============================
     LIMITAR RESULTADOS
  ============================== */

  geral = limitar(geral, 0, 200);
  redDot = limitar(redDot, 0, 200);
  mira2x = limitar(mira2x, 0, 200);
  mira4x = limitar(mira4x, 0, 200);
  awm = limitar(awm, 0, 200);
  olhadinha = limitar(olhadinha, 0, 200);


  /* ==============================
     MOSTRAR RESULTADO
  ============================== */

  document.getElementById("geral").textContent =
    geral;

  document.getElementById("redDot").textContent =
    redDot;

  document.getElementById("mira2x").textContent =
    mira2x;

  document.getElementById("mira4x").textContent =
    mira4x;

  document.getElementById("awm").textContent =
    awm;

  document.getElementById("olhadinha").textContent =
    olhadinha;


  /* ==============================
     RESUMO
  ============================== */

  let textoDpi = "Sem DPI";

  if (modoDpi === "com") {
    textoDpi = "DPI " + dpiInput.value;
  }

  document.getElementById("resumo").textContent =
    celular +
    " • " +
    textoDpi +
    " • " +
    estilo +
    " • " +
    mira;


  /* ==============================
     MOSTRA O CARD
  ============================== */

  const resultado =
    document.getElementById("resultado");

  resultado.classList.add("active");

  resultado.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/* ==============================
   GERAR NOVAMENTE
============================== */

function novaSensi() {

  const resultado =
    document.getElementById("resultado");

  resultado.classList.remove("active");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

  </script>
